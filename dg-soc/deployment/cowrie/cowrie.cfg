# Owner: M2. Overrides only; Cowrie falls back to cowrie.cfg.dist for everything else.
# Check option names against the pinned image's etc/cowrie.cfg.dist before the event.

[honeypot]
hostname = files-srv-02
log_path = var/log/cowrie
# Keep the emulated shell. Never enable proxy mode.
backend = shell

[shell]
# Fake filesystem with /home/dg_demo/notes.txt and its embedded contents.
filesystem = /cowrie/cowrie-git/custom/fs.pickle
kernel_version = 5.15.0-91-generic
kernel_build_string = #101-Ubuntu SMP
hardware_platform = x86_64
operating_system = GNU/Linux

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = false
