{% extends "base.html" %}
{% block title %}Sign in · {{ org }}{% endblock %}
{% block content %}
<section class="auth">
  <div class="card auth__card">
    <h1>Sign in</h1>
    <p class="muted">Use your portal account.</p>
    {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
    <form method="post" class="form">
      <label>Email<input type="email" name="username" autocomplete="username" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn btn--wide" type="submit">Sign in</button>
    </form>
    <p class="muted small">Forgot your password? Contact your group administrator.</p>
  </div>
</section>
{% endblock %}
